name: CI on CRACI

on:
  push:
    branches: [p2-finish, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.arch }})
    runs-on: craci
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            image: ubuntu-24.04
          - arch: arm64
            image: craci-slim-arm
    steps:
      - uses: cracicorp/setup@v1
        with:
          size: "4"
          image: ${{ matrix.image }}
          network: |
            {}
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Tests
        env:
          LLM_PROVIDER: none
        run: python -m pytest -q
      - name: Contract check
        run: python scripts/check_contract.py

  web:
    name: web
    runs-on: craci
    defaults:
      run:
        working-directory: web
    steps:
      - uses: cracicorp/setup@v1
        with:
          size: "4"
          image: ubuntu-24.04
          network: |
            {}
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  summary:
    name: summary
    needs: [python, web]
    runs-on: craci
    steps:
      - uses: cracicorp/setup@v1
        with:
          size: "1"
          image: ubuntu-24.04
          network: |
            {}
      - name: Write summary
        run: |
          {
            echo "## CI on CRACI"
            echo "Python tests ran on CRACI (amd64 + arm64), web typecheck and build ran on CRACI."
            echo "Egress was locked to the built-in package presets, so the generated SBOM is complete."
          } >> "$GITHUB_STEP_SUMMARY"
